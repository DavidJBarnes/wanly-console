server {
    listen 80;
    server_name console.wanly22.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name console.wanly22.com;

    # HTTP/2, so one browser tab is not capped at six requests to this host (console#559).
    # Over HTTP/1.1 Chrome opens at most six connections per host and queues the rest, and a
    # describe holds its connection until its caption-queue turn comes and goes -- minutes
    # while a dataset captions. Six of those and every other request (a delete, a listing, a
    # poll) waited in the browser behind them: "the UI hangs while captioning". HTTP/2
    # multiplexes them all over one connection.
    http2 on;

    ssl_certificate /etc/letsencrypt/live/console.wanly22.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.wanly22.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to wanly-api
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        client_max_body_size 1G;
    }

    # index.html must always revalidate. It is the only file that knows which content-hashed
    # bundle is current, so letting a browser cache it pins that browser to a stale app across
    # every future deploy — the assets update, the pointer to them does not. Exact-match wins over
    # `location /`, and the SPA fallback above re-runs location matching on its internal redirect,
    # so deep routes get this header too.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache static assets. Vite content-hashes these filenames, so a changed file is a changed URL
    # and immutable is safe. One header, not two: `expires` emits its own Cache-Control and the
    # add_header appended a second, conflicting one.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
